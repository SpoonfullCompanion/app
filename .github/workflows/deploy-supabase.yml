name: Deploy Supabase Functions

# Continuous deployment for Supabase Edge Functions. Runs on every push to main
# that touches the functions (or can be triggered manually). Skips gracefully if
# the SUPABASE_ACCESS_TOKEN secret has not been configured yet.

on:
  push:
    branches: [main]
    paths:
      - "supabase/functions/**"
      - "supabase/config.toml"
      - ".github/workflows/deploy-supabase.yml"
  workflow_dispatch:

concurrency:
  group: supabase-deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check for Supabase access token
        id: guard
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -n "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::SUPABASE_ACCESS_TOKEN is not set — skipping Supabase function deploy. Add it in repo Settings → Secrets to enable CD."
          fi

      - name: Set up Supabase CLI
        if: steps.guard.outputs.ready == 'true'
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy Edge Functions
        if: steps.guard.outputs.ready == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
        run: |
          PROJECT_REF="$(echo "$SUPABASE_URL" | sed -E 's#https?://([^.]+)\..*#\1#')"
          if [ -z "$PROJECT_REF" ]; then
            echo "::error::Could not derive the Supabase project ref from VITE_SUPABASE_URL."
            exit 1
          fi
          echo "Deploying Edge Functions to project: $PROJECT_REF"
          for fn in send-push delete-account submit-feedback; do
            echo "--- deploying $fn ---"
            supabase functions deploy "$fn" --project-ref "$PROJECT_REF"
          done
